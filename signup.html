<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - TrustHub Africa</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <main class="auth-main">
    <div class="auth-card">
      <div>
        <p class="eyebrow">TrustHub Africa</p>
        <h1>Create your account</h1>
        <p>Join Africa’s trusted marketplace for buyers and sellers.</p>
      </div>
      <form id="signup-form" novalidate>
        <div class="form-grid">
          <div class="field-group">
            <label for="full-name">Full name</label>
            <input type="text" id="full-name" name="full-name" placeholder="Jane Doe" required>
            <p class="input-error" id="error-full-name"></p>
          </div>
          <div class="field-group">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" placeholder="jane@example.com" required>
            <p class="input-error" id="error-email"></p>
          </div>
          <div class="field-group">
            <label for="phone">Phone number</label>
            <input type="tel" id="phone" name="phone" placeholder="+234 800 000 0000" required>
            <p class="input-error" id="error-phone"></p>
          </div>
          <div class="field-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password" required>
            <p class="input-error" id="error-password"></p>
          </div>
          <div class="field-group">
            <label for="confirm-password">Confirm password</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm password" required>
            <p class="input-error" id="error-confirm-password"></p>
          </div>
        </div>
        <div class="field-group checkbox-label">
          <input type="checkbox" id="agree" name="agree" required>
          <span>I agree to TrustHub Africa’s Terms, Privacy Policy, and Seller Rules.</span>
        </div>
        <p class="input-error" id="error-agree"></p>
        <button type="submit" class="btn btn-primary">Create account</button>
        <p class="footer-note">Already have an account? <a href="login.html">Log in</a></p>
      </form>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
